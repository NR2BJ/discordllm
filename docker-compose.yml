# Portainer 스택 Web editor에 그대로 붙여넣는 compose.
# 이미지는 GitHub Actions가 빌드해 ghcr에 올린다(.github/workflows). 되돌리려면 스택 env에 GEMINI_TAG/LLM_TAG/CLAUDE_TAG=<커밋 해시>.
name: discord

services:
  discord-lavalink:
    image: ghcr.io/lavalink-devs/lavalink
    container_name: discord-lavalink
    restart: unless-stopped
    environment:
      SERVER_PORT: 2333
      SERVER_ADDRESS: 0.0.0.0
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      LAVALINK_SERVER_SOURCES_YOUTUBE: "false"
      LAVALINK_SERVER_SOURCES_BANDCAMP: "false"
      LAVALINK_SERVER_SOURCES_SOUNDCLOUD: "false"
      LAVALINK_SERVER_SOURCES_TWITCH: "false"
      LAVALINK_SERVER_SOURCES_VIMEO: "false"
      LAVALINK_SERVER_SOURCES_NICO: "false"
      LAVALINK_SERVER_SOURCES_HTTP: "false"
      LAVALINK_SERVER_SOURCES_LOCAL: "true"
      _JAVA_OPTIONS: -Xms256M -Xmx512M
    volumes:
      - /mnt/storage/docker/discord/sb:/opt/lavalink/sb:ro

  discord-gemini:
    image: ghcr.io/nr2bj/discord-gemini:${GEMINI_TAG:-latest}
    container_name: discord-gemini
    pull_policy: always
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    depends_on:
      - discord-lavalink
    environment:
      GEMINI_DISCORD_TOKEN: ${GEMINI_DISCORD_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      CONFIG_FILE: /data/gemini.json
      GEMINI_USE_LAVALINK: "1"
      LAVALINK_HOST: discord-lavalink
      LAVALINK_PORT: 2333
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      LAVALINK_SECURE: "0"
      LAVALINK_LABEL: main
      LAVALINK_LOCAL_ROOT: /opt/lavalink/sb
    volumes:
      - /mnt/storage/docker/discord/data:/data
      - /mnt/storage/docker/discord/sb:/app/sb

  discord-llm:
    image: ghcr.io/nr2bj/discord-llm:${LLM_TAG:-latest}
    container_name: discord-llm
    pull_policy: always
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    environment:
      LLM_DISCORD_TOKEN: ${LLM_DISCORD_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      CONFIG_FILE: /data/llm.json
    volumes:
      - /mnt/storage/docker/discord/data:/data

  discord-claude:
    image: ghcr.io/nr2bj/discord-claude:${CLAUDE_TAG:-latest}
    container_name: discord-claude
    pull_policy: always
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    environment:
      CLAUDE_DISCORD_TOKEN: ${CLAUDE_DISCORD_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      CONFIG_FILE: /data/claude.json
    volumes:
      - /mnt/storage/docker/discord/data:/data
