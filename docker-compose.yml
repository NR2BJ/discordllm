services:
  gemini:
    build: ./NRGemini
    restart: unless-stopped
    environment:
      GEMINI_DISCORD_TOKEN: ${GEMINI_DISCORD_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CONFIG_FILE: /data/gemini.json
    volumes:
      - /mnt/storage/docker/discord/data:/data
      - /mnt/storage/docker/discord/sb:/app/sb

  grok:
    build: ./NRGrok
    restart: unless-stopped
    environment:
      GROK_DISCORD_TOKEN: ${GROK_DISCORD_TOKEN}
      XAI_API_KEY: ${XAI_API_KEY}
      CONFIG_FILE: /data/grok.json
    volumes:
      - /mnt/storage/docker/discord/data:/data

  llm:
    build: ./NRLLM
    restart: unless-stopped
    environment:
      LLM_DISCORD_TOKEN: ${LLM_DISCORD_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      CONFIG_FILE: /data/llm.json
    volumes:
      - /mnt/storage/docker/discord/data:/data
