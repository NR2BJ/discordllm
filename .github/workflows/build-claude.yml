name: build-claude

# NRClaude 가 바뀌면 이미지를 빌드해 ghcr.io/nr2bj/discord-claude 에 올린다 (latest + 커밋 해시 태그)
on:
  push:
    branches: [main]
    paths:
      - "NRClaude/**"
      - ".github/workflows/build-claude.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./NRClaude
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/nr2bj/discord-claude:latest
            ghcr.io/nr2bj/discord-claude:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=claude
          cache-to: type=gha,mode=max,scope=claude
